# Default values for the User Service Helm chart

replicaCount: 1
image:
  repository: ghcr.io/nooshet-backend/user-service
  tag: development-89b025d
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-secret
service:
  type: ClusterIP
  port: 8080
ingress:
  enabled: true
  annotations: {}
  hosts:
    - host: user.nooshet.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
resources:
  limits:
    memory: 512Mi
    cpu: 500m
  requests:
    cpu: 250m
    memory: 256Mi
autossl: {}
istio:
  enabled: true
apiGatewayFullname: "api-gateway"
database:
  host: postgresql-user
  port: 5432
  name: nooshet_user
  user: nooshet_user
  password: user_password_123
redis:
  host: "redis"
  port: "6379"
