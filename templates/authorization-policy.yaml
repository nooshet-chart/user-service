apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ include "user-service.fullname" . }}-authz
spec:
  selector:
    matchLabels:
      {{- include "user-service.selectorLabels" . | nindent 6 }}
  action: ALLOW
  rules:
{{- if and .Values.istio (hasKey .Values.istio "authorization") (hasKey .Values.istio.authorization "internalCallers") (gt (len .Values.istio.authorization.internalCallers) 0) }}
    - from:
        - source:
            principals:
{{- toYaml .Values.istio.authorization.internalCallers | nindent 14 }}
{{- else }}
    - {}
{{- end }}
